[project]
name = "alex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=1.0.1",
    "langchain-anthropic>=1.4.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.52",
    "textual>=8.2.6",
    "jinja2>=3.1.6",
    "json-repair>=0.59.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
