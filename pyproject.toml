[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.52",
    "textual>=8.2.6",
    "jinja2>=3.1.6",
    "json-repair>=0.59.10",
    "python-dotenv>=1.2.2",
    "tzdata>=2025.1",
    "apscheduler>=3.11.0",
    "import-linter>=2.11",
]

[project.scripts]
alex = "alex.entry:main"

[project.entry-points."alex.modules"]
memory = "alex.memory.module:MemoryModule"
skill = "alex.skill.module:SkillModule"
tools = "alex.tools.module:ToolsModule"
mcp = "alex.mcp.module:MCPModule"
agent = "alex.agent.module:AgentModule"
tui = "alex.tui.module:TuiModule"
store = "alex.store.module:StoreModule"
scheduler = "alex.scheduler.module:CronModule"

[tool.setuptools.package-data]
alex = ["prompts/*.j2", "tui/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
